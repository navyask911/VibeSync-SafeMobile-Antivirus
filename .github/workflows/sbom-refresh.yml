name: Refresh dependency SBOM
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/sbom.json"
      - "THIRD_PARTY_NOTICES.md"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safemobile-sbom-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX aggregate SBOM
        run: ./gradlew --no-daemon cyclonedxBom
      - name: Generate docs/sbom.json and third-party notice inventory
        run: |
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json docs/sbom.json
          python3 scripts/render_third_party_notices.py --input docs/sbom.json --output THIRD_PARTY_NOTICES.md
      - name: Publish generated compliance files to main
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/sbom.json THIRD_PARTY_NOTICES.md; then
            echo "SBOM and third-party notice inventory are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sbom.json THIRD_PARTY_NOTICES.md
          git commit -m "chore(compliance): refresh generated SBOM and third-party inventory [skip ci]"
          git push
      - name: Upload generated compliance files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safemobile-cyclonedx-sbom
          path: |
            docs/sbom.json
            THIRD_PARTY_NOTICES.md
          if-no-files-found: warn
          retention-days: 30
