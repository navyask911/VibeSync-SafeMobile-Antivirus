name: Clean up production-hardening branches
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.number == 7 && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the reviewed production-hardening refs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowlist = [
              "feat/production-phase1-detection-20261022",
              "feat/production-phase3-privacy-20261022",
              "feat/production-phase2-signed-feed-20261022",
              "feat/production-phase4-compliance-20261022",
              "feat/production-phase5-docs-20261022"
            ];
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            for (const branch of allowlist) {
              if (openPulls.some(pr => pr.base.ref === branch || pr.head.ref === branch)) {
                core.notice(`Keeping ${branch}: an open pull request still references it.`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted merged production-hardening branch: ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Branch already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }
