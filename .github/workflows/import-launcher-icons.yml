name: Import official SafeMobile launcher icons

on:
  push:
    branches: [main]
    paths:
      - "app_icons.zip"
      - "app_icons.zip.zip"
      - "scripts/import_launcher_icons.py"
      - ".github/workflows/import-launcher-icons.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: safemobile-official-icon-import
  cancel-in-progress: false

jobs:
  import-icons:
    if: github.repository == 'navyask911/VibeSync-SafeMobile-Antivirus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and import icons in temporary scratch space
        id: import
        shell: bash
        run: |
          set -euo pipefail
          # The uploaded ZIP is deliberately deleted after the first successful
          # import. Later pushes / manual reruns must validate the imported files
          # rather than fail because the one-shot source archive is no longer present.
          if [[ ! -f app_icons.zip && ! -f app_icons.zip.zip ]]; then
            python3 - <<'PY'
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET

          root = Path(".")
          signature = b"\\x89PNG\\r\\n\\x1a\\n"
          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          def check_png(path: Path, expected: int) -> None:
              data = path.read_bytes()
              if len(data) < 24 or data[:8] != signature or data[12:16] != b"IHDR":
                  raise SystemExit(f"SAFE STOP: invalid/missing PNG: {path}")
              size = struct.unpack(">II", data[16:24])
              if size != (expected, expected):
                  raise SystemExit(f"SAFE STOP: {path} is {size[0]}x{size[1]}, expected {expected}x{expected}")

          for density, size in densities.items():
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  check_png(root / f"app/src/main/res/mipmap-{density}/{name}", size)

          check_png(root / "docs/assets/safemobile-playstore-icon.png", 512)
          bg = root / "app/src/main/res/drawable/ic_launcher_background.xml"
          if not bg.is_file():
              raise SystemExit("SAFE STOP: imported adaptive icon background is missing")
          for density in densities:
              if not (root / f"app/src/main/res/mipmap-{density}/ic_launcher_foreground.png").is_file():
                  raise SystemExit(f"SAFE STOP: adaptive foreground missing for {density}")
          android_ns = "{http://schemas.android.com/apk/res/android}drawable"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = root / f"app/src/main/res/mipmap-anydpi-v26/{name}"
              try:
                  node = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as exc:
                  raise SystemExit(f"SAFE STOP: invalid adaptive icon {path}: {exc}")
              refs = {child.attrib.get(android_ns) for child in node.iter() if android_ns in child.attrib}
              if node.tag.split("}")[-1] != "adaptive-icon" or not {
                  "@drawable/ic_launcher_background", "@mipmap/ic_launcher_foreground"
              }.issubset(refs):
                  raise SystemExit(f"SAFE STOP: incomplete adaptive icon references in {path}")

          print("Official launcher icons are already imported; ZIP archive was removed.")
          print("Validated 10 density PNGs, 512x512 Play artwork, and both adaptive icon XML files.")
          PY
            echo "archive=" >> "$GITHUB_OUTPUT"
            echo "already_imported=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/safemobile-icons"
          python3 scripts/import_launcher_icons.py \
            --root . \
            --scratch "$RUNNER_TEMP/safemobile-icons" \
            --report "$RUNNER_TEMP/icon-import-report.json" \
            | tee "$RUNNER_TEMP/icon-import.log"
          archive="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_path"])' "$RUNNER_TEMP/icon-import-report.json")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "already_imported=false" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/icon-import-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          density_files=[p for p in report["copied_files"]
                         if "/mipmap-" in p and p.rsplit("/",1)[-1] in ("ic_launcher.png","ic_launcher_round.png")]
          if len(density_files) != 10:
              raise SystemExit(f"SAFE STOP: expected 10 launcher density PNGs, got {len(density_files)}")
          if report["play_store_icon"] != "docs/assets/safemobile-playstore-icon.png":
              raise SystemExit("SAFE STOP: Play Store artwork missing")
          print("Validated 5 density pairs and the 512x512 Play Store icon.")
          print("Adaptive resources updated:", report["adaptive_icons_updated"])
          PY

      - name: Commit launcher assets and delete uploaded archive
        env:
          ARCHIVE: ${{ steps.import.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout is clean; stage the resource tree to include all
          # adaptive foreground/background files discovered from the source ZIP.
          git add app/src/main/res/ docs/assets/safemobile-playstore-icon.png
          git rm -- "$ARCHIVE"
          git diff --cached --check
          git commit -m "chore(branding): import official SafeMobile launcher icons"
          git push origin HEAD:main

      - name: Dispatch Android CI for final icon commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-ci.yml --ref main

      - name: Clean up ephemeral staging
        if: always()
        run: rm -rf "$RUNNER_TEMP/safemobile-icons" "$RUNNER_TEMP/icon-import-report.json" "$RUNNER_TEMP/icon-import.log"
