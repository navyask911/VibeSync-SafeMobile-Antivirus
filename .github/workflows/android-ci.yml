name: Android CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: safemobile-android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-lint-build:
    name: Test, lint, and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history for version-code guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Version-code monotonicity guard
        run: python3 scripts/check_version_code.py
      - name: Dataset acquisition tooling unit tests (offline fixtures only)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Proprietary safety policy guard
        run: python3 scripts/check_proprietary_safety.py
      - name: Generate CycloneDX dependency SBOM
        run: |
          ./gradlew --no-daemon cyclonedxBom
          test -s build/reports/cyclonedx/bom.json
          python3 scripts/render_third_party_notices.py --input build/reports/cyclonedx/bom.json --output build/generated-third-party-notices.md
      - name: Capture dependency graph for licence review
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:dependencies --configuration offlineReleaseRuntimeClasspath > build/offline-release-dependency-tree.txt
          ./gradlew --no-daemon :app:dependencies --configuration feedReleaseRuntimeClasspath > build/feed-release-dependency-tree.txt
      - name: Unit tests
        run: ./gradlew --no-daemon testOfflineDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintOfflineDebug lintFeedDebug
      - name: Build offline and optional feed variants
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64: ${{ vars.SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64 }}
        run: ./gradlew --no-daemon assembleOfflineDebug assembleOfflineRelease assembleFeedRelease bundleOfflineRelease bundleFeedRelease
      - name: Verify release artifact privacy boundary
        run: python3 scripts/check_release_artifact_privacy.py
      - name: Report release signing configuration
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing: configured (secret values are not printed)."
          else
            echo "Release signing: not configured; release outputs are unsigned and cannot be uploaded to Play."
          fi
      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safe-mobile-android-artifacts
          path: |
            app/build/outputs/apk/offline/debug/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/feed/release/*.apk
            app/build/outputs/bundle/offlineRelease/*.aab
            app/build/outputs/bundle/feedRelease/*.aab
            build/offline-release-dependency-tree.txt
            build/feed-release-dependency-tree.txt
            build/reports/cyclonedx/bom.json
            build/generated-third-party-notices.md
          if-no-files-found: warn
          retention-days: 14

  android-emulator-tests:
    name: Instrumented tests on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [26, 30, 34, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on local emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set +e
            ./gradlew --no-daemon connectedOfflineDebugAndroidTest
            test_status=$?
            mkdir -p build/emulator-diagnostics
            adb logcat -d -t 20000 > build/emulator-diagnostics/logcat.txt 2>&1 || true
            exit $test_status
      - name: Upload instrumented test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: |
            build/emulator-diagnostics/logcat.txt
            app/build/reports/androidTests/connected/debug/flavors/offline/
            app/build/outputs/androidTest-results/connected/offlineDebug/
          if-no-files-found: ignore
          retention-days: 7

