name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**", "phase/**"]
permissions:
  contents: read
concurrency:
  group: safemobile-android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-lint-build:
    name: Test, lint, and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history for version-code guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Version-code monotonicity guard
        run: python3 scripts/check_version_code.py
      - name: Dataset acquisition tooling unit tests (offline fixtures only)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Proprietary safety policy guard
        run: python3 scripts/check_proprietary_safety.py
      - name: Generate CycloneDX dependency SBOM (retry transient repository failures)
        run: |
          set -e
          attempt=1
          until ./gradlew --no-daemon cyclonedxBom; do
            if [ "$attempt" -ge 3 ]; then
              echo "CycloneDX generation failed after $attempt attempts."
              exit 1
            fi
            echo "CycloneDX attempt $attempt failed (possibly transient Maven rate limiting); retrying in 15 seconds."
            attempt=$((attempt + 1))
            sleep 15
          done
          test -s build/reports/cyclonedx/bom.json
          python3 scripts/render_third_party_notices.py --input build/reports/cyclonedx/bom.json --output build/generated-third-party-notices.md
      - name: Capture dependency graph for licence review
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:dependencies --configuration offlineReleaseRuntimeClasspath > build/offline-release-dependency-tree.txt
          ./gradlew --no-daemon :app:dependencies --configuration feedReleaseRuntimeClasspath > build/feed-release-dependency-tree.txt
      - name: Unit tests
        run: ./gradlew --no-daemon testOfflineDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintOfflineDebug lintFeedDebug
      - name: Build offline and optional feed variants
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64: ${{ vars.SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64 }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ vars.SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64 }}
        run: ./gradlew --no-daemon assembleOfflineDebug assembleOfflineRelease assembleFeedRelease bundleOfflineRelease bundleFeedRelease
      - name: Verify release artifact privacy boundary
        run: python3 scripts/check_release_artifact_privacy.py
      - name: Report release signing configuration
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing: configured (secret values are not printed)."
          else
            echo "Release signing: not configured; release outputs are unsigned and cannot be uploaded to Play."
          fi
      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safe-mobile-android-artifacts
          path: |
            app/build/outputs/apk/offline/debug/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/feed/release/*.apk
            app/build/outputs/bundle/offlineRelease/*.aab
            app/build/outputs/bundle/feedRelease/*.aab
            build/offline-release-dependency-tree.txt
            build/feed-release-dependency-tree.txt
            build/reports/cyclonedx/bom.json
            build/generated-third-party-notices.md
          if-no-files-found: warn
          retention-days: 14

  android-emulator-tests:
    name: Instrumented tests on API ${{ matrix.api-level }}
    needs: test-lint-build
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [26, 30, 34, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Assemble the target and instrumentation APKs while no emulator is running.
      # Keeping dexing/packaging off the AVD startup window avoids system_server/ADB starvation
      # on API 30 and 36 runners.
      - name: Prebuild instrumentation APKs before emulator startup
        env:
          SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64: ${{ vars.SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64 }}
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            assembleOfflineDebug assembleOfflineDebugAndroidTest
      # GitHub-hosted runners do not always expose /dev/kvm. Enable KVM when available;
      # let android-emulator-runner select software emulation otherwise. Never skip tests.
      - name: Configure optional KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm ||
              echo "::warning::Could not refresh KVM udev permissions."
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM available: using accelerated Android emulation."
          else
            echo "::warning::KVM unavailable: Android emulator runner will use software emulation. Instrumented tests remain required."
          fi
      - name: Run instrumented tests on local emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          # AOSP 'default' is the leanest verified API 34/36 image already installed by CI;
          # google_apis adds Play-services components and does not solve missing host KVM.
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          # -noaudio is the action's supported audio-disabling mechanism.
          # 'corrupt-avd-ihate-waiting' and 'disable-audio' are not valid action.yml inputs.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          # Action's 'auto' checks /dev/kvm: with KVM, hardware acceleration stays
          # enabled; without KVM, the runner appends '-accel off' to boot with QEMU TCG.
          disable-linux-hw-accel: auto
          # Reserve host CPU/memory headroom on API 34/36 for ADB and the Gradle JVM,
          # especially on runners without /dev/kvm that must use software emulation.
          ram-size: ${{ matrix.api-level >= 34 && '3072M' || '4096M' }}
          heap-size: ${{ matrix.api-level >= 34 && '384M' || '512M' }}
          cores: ${{ matrix.api-level >= 34 && 2 || 4 }}
          script: bash scripts/run_instrumented_tests.sh
      - name: Upload instrumented test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: |
            build/emulator-diagnostics/
            app/build/reports/androidTests/connected/debug/flavors/offline/
            app/build/outputs/androidTest-results/connected/offlineDebug/
          if-no-files-found: ignore
          retention-days: 7

