name: Android CI
on:
  workflow_dispatch:
  push:
    branches: [main, "release/**", "feat/v1.8.0-brand-privacy-notifications"]
  pull_request:
    branches: [main, "feat/**", "phase/**", "feature/**", "fix/**"]
permissions:
  contents: read
concurrency:
  # Deduplicate reruns of the same commit without queueing a newer commit behind
  # an older API matrix; each commit gets an independent Actions concurrency group.
  group: safemobile-android-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  test-lint-build:
    name: Test, lint, and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history for version-code guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify AGP 9, Gradle 9.1 and Paparazzi plugin versions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id("com.android.application") version "9.0.1"' build.gradle.kts
          grep -F 'id("app.cash.paparazzi") version "2.0.0-alpha05.1"' build.gradle.kts
          grep -F 'gradle-9.1.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon help
      - name: Set up Rust and cargo-ndk for YARA-X
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_DIR" ]]; then
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/zipalign" ]]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - name: Version-code monotonicity guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == "feat/ui-polish-v1.4.1" ]]; then
            python3 scripts/check_version_code.py --allow-pr-version-reuse
          else
            python3 scripts/check_version_code.py
          fi
      - name: Download and verify approved ML release assets
        run: ./gradlew --no-daemon :app:downloadMlAssets
      - name: Validate Kannada/French resource coverage and TTS locale strings
        run: python3 scripts/check_locale_completeness.py
      - name: Audit all localized Android values resources and duplicate IDs
        run: python3 scripts/audit_locale_resources.py
      - name: Check Kannada/Japanese translations and siren receiver safety
        run: python3 scripts/check_ja_kn_and_siren.py
      - name: Dataset acquisition tooling unit tests (offline fixtures only)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Detection benchmark readiness report
        run: |
          mkdir -p build
          python3 scripts/benchmark_detection.py --output build/detection-benchmark.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("build/detection-benchmark.json").read_text(encoding="utf-8"))
          assert result["status"] == "NOT_MEASURED", "No approved corpus means metrics must remain NOT_MEASURED"
          assert all(value == "NOT MEASURED" for value in result["metrics"].values()), "Never fabricate efficacy"
          assert result["regression_gate"]["status"] == "NOT_RUN"
          print("Detection benchmark: NOT_MEASURED (no approved corpus or device scan).")
          PY
      - name: Proprietary safety policy guard
        run: python3 scripts/check_proprietary_safety.py
      - name: Verify optional threat contribution privacy boundary
        run: python3 scripts/check_global_threat_intelligence.py
      - name: Verify AdMob consent, Pro gating and privacy disclosures
        run: python3 scripts/check_admob_privacy.py
      - name: Verify v1.10.6 scan metadata boundaries, offline WorkManager and SAF integrity requirements
        run: python3 scripts/check_android_release_readiness.py
      - name: Generate CycloneDX dependency SBOM (retry transient repository failures)
        run: |
          set -e
          attempt=1
          until ./gradlew --no-daemon cyclonedxBom; do
            if [ "$attempt" -ge 3 ]; then
              echo "CycloneDX generation failed after $attempt attempts."
              exit 1
            fi
            echo "CycloneDX attempt $attempt failed (possibly transient Maven rate limiting); retrying in 15 seconds."
            attempt=$((attempt + 1))
            sleep 15
          done
          test -s build/reports/cyclonedx/bom.json
          python3 scripts/render_third_party_notices.py --input build/reports/cyclonedx/bom.json --output build/generated-third-party-notices.md
      - name: Capture dependency graph for licence review
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:dependencies --configuration offlineReleaseRuntimeClasspath > build/offline-release-dependency-tree.txt
          ./gradlew --no-daemon :app:dependencies --configuration feedReleaseRuntimeClasspath > build/feed-release-dependency-tree.txt
      # The Paparazzi recorder commits the V17 tab/theme goldens before this main-branch run.
      # Keep verification on a later push so CI checks the committed images, not a pre-record checkout.
      - name: Unit tests and Paparazzi snapshot verification
        # Verify the refreshed Scan & Lab goldens and compile Room retry instrumentation tests.
        # Keep this validation restartable independently from release/publish workflows.
        run: ./gradlew --no-daemon testOfflineDebugUnitTest verifyPaparazziDebug compileOfflineDebugAndroidTestKotlin
      - name: Print unit-test failure stack traces
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          roots = [
              Path("app/build/test-results/testOfflineDebugUnitTest"),
              Path("app/build/test-results/verifyPaparazziDebug"),
          ]
          found = False
          for root in roots:
              if not root.exists():
                  continue
              for report in sorted(root.glob("TEST-*.xml")):
                  try:
                      suite = ET.parse(report).getroot()
                  except ET.ParseError as error:
                      print(f"Could not parse {report}: {error}")
                      continue
                  for case in suite.iter("testcase"):
                      for tag in ("failure", "error"):
                          detail = case.find(tag)
                          if detail is None:
                              continue
                          found = True
                          print(f"=== {case.get('classname')}.{case.get('name')} [{tag}] ===")
                          print((detail.get("message") or "")[:12000])
                          print((detail.text or "")[:24000])
          if not found:
              print("No JUnit failure XML found in the expected Gradle test-result directories.")
          PY
      - name: Upload updated Paparazzi renderings for baseline refresh
        if: failure() && hashFiles('app/build/paparazzi/failures/*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-Paparazzi-Failure-Renderings-${{ github.run_id }}
          path: app/build/paparazzi/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Android lint
        run: ./gradlew --no-daemon lintOfflineDebug lintFeedDebug lintVitalOfflineRelease lintVitalFeedRelease
      - name: Explicit debug lint requested for v1.8.1 (Offline + Feed flavors)
        run: ./gradlew --no-daemon :app:lintOfflineDebug :app:lintFeedDebug
      - name: Print Android lint error locations when lint fails
        if: failure()
        shell: bash
        run: |
          echo "Read-only lint diagnostics (does not change lint severity or build gates):"
          for report in app/build/reports/lint-results-*.txt; do
            if [[ -f "$report" ]]; then
              echo "--- $report ---"
              grep -E 'Error:|[0-9]+ errors' "$report" | head -n 300 || true
            fi
          done
          for report in app/build/reports/lint-results-*.xml; do
            if [[ -f "$report" ]]; then
              echo "--- XML error identifiers in $report ---"
              grep -B 1 'severity="Error"' "$report" | head -n 400 || true
            fi
          done
      - name: Validate database signing public key on main CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DB_SIGNING_PUBLIC_KEY: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import sys
          value = os.environ.get("DB_SIGNING_PUBLIC_KEY", "").strip()
          try:
              raw = base64.b64decode(value, validate=True)
          except Exception as error:
              sys.exit(f"DB_SIGNING_PUBLIC_KEY is missing or invalid Base64: {error}")
          if len(raw) != 32:
              sys.exit(f"DB_SIGNING_PUBLIC_KEY must decode to 32 raw Ed25519 bytes; got {len(raw)}")
          print("Database signing public key: configured (32-byte Ed25519 key).")
          PY
      - name: Build offline and optional feed variants
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64: ${{ vars.SAFE_MOBILE_FEED_ED25519_PUBLIC_KEY_B64 }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleOfflineDebug assembleOfflineRelease assembleFeedRelease bundleOfflineRelease bundleFeedRelease
      # Build the x86_64 debug app + AndroidJUnitRunner APK once, then reuse the
      # exact artifacts across every emulator API/shard job. Release APK/AAB outputs
      # above have already been built with their production ARM ABI filters.
      - name: Build reusable x86_64 emulator instrumentation APKs
        env:
          ORG_GRADLE_PROJECT_yaraxAndroidAbis: x86_64
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8" \
            assembleOfflineDebug assembleOfflineDebugAndroidTest
      - name: Capture the Cargo-resolved YARA-X lockfile for a reproducible follow-up
        run: |
          set -euo pipefail
          lock="app/build/native/yarax_android/Cargo.lock"
          test -s "$lock"
          mkdir -p build
          cp "$lock" build/yarax-android-Cargo.lock
          sha256sum build/yarax-android-Cargo.lock > build/yarax-android-Cargo.lock.sha256
      - name: Verify 16 KB ELF and APK alignment (Offline + Feed)
        run: >-
          python3 scripts/check_16kb_alignment.py
          app/build/outputs/apk/offline/release/*.apk
          app/build/outputs/apk/feed/release/*.apk
          app/build/outputs/bundle/offlineRelease/*.aab
          app/build/outputs/bundle/feedRelease/*.aab
      - name: Build and validate harmless siren fixture
        run: bash scripts/test_siren.sh
      - name: Upload reusable emulator instrumentation inputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safemobile-instrumentation-v1.10.9-${{ github.sha }}
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/androidTest/offline/debug/app-offline-debug-androidTest.apk
            build/siren-test/SafeMobile-Siren-Test.apk
          if-no-files-found: error
          retention-days: 3
      - name: Verify release artifact privacy boundary
        run: python3 scripts/check_release_artifact_privacy.py
      - name: Verify configured release APK v2/v3 and AAB signatures
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/release/v1.10.9-scan-results" ]]; then
              echo "::error::Release signing secrets are required to publish v1.10.9 candidate artifacts."
              exit 1
            fi
            echo "Signing secrets unavailable for this CI context; outputs are test artifacts only."
            exit 0
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          for flavor in offline feed; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            aab="app/build/outputs/bundle/${flavor}Release/app-$flavor-release.aab"
            verification="$("$apksigner" verify --verbose "$apk" 2>&1)"
            printf '%s\n' "$verification"
            grep -Eq '^Verified using v2 scheme[^:]*: true$' <<< "$verification"
            grep -Eq '^Verified using v3 scheme[^:]*: true$' <<< "$verification"
            echo "$flavor APK signature: v2 and v3 verified."
            aab_verify_log="$(mktemp)"
            if ! jarsigner -verify "$aab" >"$aab_verify_log" 2>&1; then
              echo "::error::AAB signature verification command failed for the $flavor variant."
              grep -Ei 'jar|unsigned|signer|digest|signature|error|exception|warning' "$aab_verify_log" | tail -n 30 || true
              exit 1
            fi
            if ! grep -qi 'jar verified' "$aab_verify_log"; then
              echo "::error::AAB verifier did not report a verified JAR signature for the $flavor variant."
              grep -Ei 'jar|unsigned|signer|digest|signature|error|exception|warning' "$aab_verify_log" | tail -n 30 || true
              exit 1
            fi
            echo "$flavor AAB JAR signature: verified."
            rm -f "$aab_verify_log"
          done
          sha256sum app/build/outputs/apk/{offline,feed}/release/*.apk \
            app/build/outputs/bundle/{offline,feed}Release/*.aab > build/release-artifact-sha256.txt
      - name: Report release signing configuration
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing: configured (secret values are not printed)."
          else
            echo "Release signing: not configured; release outputs are unsigned and cannot be uploaded to Play."
          fi
      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safe-mobile-android-artifacts-v1.10.9-${{ github.sha }}
          path: |
            app/build/outputs/apk/offline/debug/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/feed/release/*.apk
            app/build/outputs/bundle/offlineRelease/*.aab
            app/build/outputs/bundle/feedRelease/*.aab
            build/offline-release-dependency-tree.txt
            build/feed-release-dependency-tree.txt
            build/reports/cyclonedx/bom.json
            build/generated-third-party-notices.md
            build/detection-benchmark.json
            build/release-artifact-sha256.txt
            build/yarax-android-Cargo.lock
            build/yarax-android-Cargo.lock.sha256
          if-no-files-found: warn
          retention-days: 14

  android-emulator-tests:
    name: Instrumented tests on API ${{ matrix.api-level }} (shard ${{ matrix.shard }}/2)
    needs: test-lint-build
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Standard GitHub-hosted runners are isolated per job. Three concurrent
      # emulator VMs provide useful parallelism without oversubscribing one host.
      max-parallel: 3
      matrix:
        # Keep API 28 for Android 9's YARA-X Pulley/no-JIT regression coverage.
        # Each API executes both AndroidJUnitRunner shards; neither shard is optional.
        api-level: [26, 28, 33, 34, 36]
        shard: [0, 1]
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download shared x86_64 instrumentation APKs and harmless fixture
        uses: actions/download-artifact@v4
        with:
          name: safemobile-instrumentation-v1.10.9-${{ github.sha }}
          path: .
      - name: Verify downloaded emulator test inputs
        shell: bash
        run: |
          set -euo pipefail
          app_apk="app/build/outputs/apk/offline/debug/app-offline-debug.apk"
          test_apk="app/build/outputs/apk/androidTest/offline/debug/app-offline-debug-androidTest.apk"
          fixture_apk="build/siren-test/SafeMobile-Siren-Test.apk"
          test -s "$app_apk"
          test -s "$test_apk"
          test -s "$fixture_apk"
          unzip -l "$app_apk" | grep -q 'lib/x86_64/'
          echo "Verified shared app APK, AndroidJUnitRunner APK, x86_64 native payload and harmless fixture."
      # Hosted runners do not always expose /dev/kvm. Enable it where present;
      # the emulator action uses software emulation otherwise. Tests are never skipped.
      - name: Configure optional KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm ||
              echo "::warning::Could not refresh KVM udev permissions."
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM available: using accelerated Android emulation."
          else
            echo "::warning::KVM unavailable: Android emulator runner will use software emulation. Instrumented tests remain required."
          fi
      - name: Run assigned AndroidJUnitRunner shard on local emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_API_LEVEL: ${{ matrix.api-level }}
          INSTRUMENTATION_NUM_SHARDS: "2"
          INSTRUMENTATION_SHARD_INDEX: ${{ matrix.shard }}
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: auto
          ram-size: ${{ matrix.api-level >= 34 && '3072M' || '4096M' }}
          heap-size: ${{ matrix.api-level >= 34 && '384M' || '512M' }}
          cores: ${{ matrix.api-level >= 34 && 2 || 4 }}
          script: bash scripts/run_instrumented_tests.sh
      - name: Clean up orphaned Crashpad processes
        if: always()
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ! pgrep -f '[/]crashpad_handler([[:space:]]|$)' >/dev/null 2>&1; then
              break
            fi
            pkill -9 -f '[/]crashpad_handler([[:space:]]|$)' || true
            sleep 2
          done
      - name: Upload API/shard instrumentation log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}-shard-${{ matrix.shard }}
          path: build/emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  verify-instrumented-test-shards:
    name: Verify all API levels and instrumentation shards
    needs: [android-emulator-tests]
    if: always() && needs.android-emulator-tests.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout shard verification script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download every API/shard diagnostics artifact
        uses: actions/download-artifact@v4
        with:
          pattern: emulator-diagnostics-api-*-shard-*
          path: build/emulator-shards
          merge-multiple: false
      - name: Verify full API/shard inventory and test coverage
        env:
          MATRIX_RESULT: ${{ needs.android-emulator-tests.result }}
          EXPECTED_TESTS_PER_API: "85"
        run: python3 scripts/verify_instrumented_shards.py build/emulator-shards

  release-v1-6-0:
    name: Clean v1.6.0 build, verify downloaded ML assets, and push annotated tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Phase 4')
    needs: [test-lint-build, verify-instrumented-test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: write
    env:
      ORG_GRADLE_PROJECT_yaraxAndroidAbis: arm64-v8a,armeabi-v7a,x86_64
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Rust and cargo-ndk for YARA-X
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_DIR" ]]; then
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/zipalign" ]]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - name: Verify release version
        run: |
          grep -F 'versionName = "1.6.4"' app/build.gradle.kts
          grep -F 'versionCode = 20261130' app/build.gradle.kts

