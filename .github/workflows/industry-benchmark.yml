name: Industry Benchmark (2,000 real APKs)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: industry-benchmark
  cancel-in-progress: false
jobs:
  scan:
    name: Read-only APK benchmark on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      INDUSTRY_MALWARE_MANIFEST_URL: ${{ vars.INDUSTRY_MALWARE_MANIFEST_URL }}
      INDUSTRY_MALWARE_MANIFEST_SHA256: ${{ vars.INDUSTRY_MALWARE_MANIFEST_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select 1000 F-Droid and 1000 approved malware APKs
        run: |
          mkdir -p "$RUNNER_TEMP/industry/results"
          python3 scripts/industry_benchmark.py prepare --plan "$RUNNER_TEMP/industry/plan.json"
      - name: Build application and real on-device benchmark test
        run: ./gradlew --no-daemon --max-workers=2 assembleOfflineDebug assembleOfflineDebugAndroidTest
      - name: Scan in cloud Android emulator, 25 temporary APKs per batch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-linux-hw-accel: auto
          script: bash scripts/run_industry_benchmark.sh
      - name: Report verified results
        run: |
          python3 scripts/industry_benchmark.py summarize --plan "$RUNNER_TEMP/industry/plan.json" \
            --results "$RUNNER_TEMP/industry/results" --output-json build/industry-benchmark.json \
            --output-markdown docs/BENCHMARK_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-benchmark-report-${{ github.run_number }}
          path: |
            docs/BENCHMARK_REPORT.md
            build/industry-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary APKs
        if: always()
        run: rm -rf "$RUNNER_TEMP/industry/corpus"

  publish:
    name: Publish verified aggregate report to main
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: industry-benchmark-report-${{ github.run_number }}
          path: published
      - name: Validate actual measured result before publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("published/build/industry-benchmark.json").read_text())
          assert result["status"]=="MEASURED", "Missing independently measured benchmark"
          assert result["total_apps"]==2000 and result["benign_apps"]==1000
          assert result["malicious_apps"]==1000 and result["not_scanned"]==0
          assert all(result[key] is not None for key in ("tpr_percent","fpr_percent","mean_latency_ms"))
          print("Verified report fields. No APK binaries are present in publish job.")
          PY
      - name: Commit report to main
        shell: bash
        run: |
          set -euo pipefail
          cp published/docs/BENCHMARK_REPORT.md docs/BENCHMARK_REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BENCHMARK_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(phase-f): publish verified 2000-APK cloud benchmark"
            git push origin HEAD:main
          fi
