name: Locale Resource Audit

on:
  workflow_dispatch:
  push:
    branches: ["release/v1.10.9-scan-results"]
    paths:
      - "app/src/main/res/values*/**.xml"
      - "app/src/main/java/com/vibesync/antivirus/core/billing/**"
      - "app/src/main/java/com/vibesync/antivirus/presentation/**"
      - "scripts/audit_locale_resources.py"
      - "scripts/check_admob_privacy.py"
      - ".github/workflows/release-apk.yml"
      - ".github/workflows/locale-resource-audit.yml"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit all localized Android resources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Audit resource IDs, translations and AAPT safety
        run: python3 scripts/audit_locale_resources.py
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-resource-audit-${{ github.sha }}
          path: build/locale-resource-audit.json
          if-no-files-found: ignore
          retention-days: 7
