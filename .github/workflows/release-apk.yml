name: Build and publish signed SafeMobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - "release-apk/**"

permissions:
  contents: write

concurrency:
  group: safemobile-production-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'navyask911/VibeSync-SafeMobile-Antivirus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DB_SIGNING_PUBLIC_KEY: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'SAFE STOP: Release keystore secrets are incomplete; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          key = base64.b64decode(os.environ.get("DB_SIGNING_PUBLIC_KEY", ""), validate=True)
          if len(key) != 32:
              raise SystemExit("SAFE STOP: DB_SIGNING_PUBLIC_KEY must be a Base64 raw 32-byte Ed25519 key.")
          print("Production signing configuration and database trust root are present.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production offline APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleOfflineRelease

      - name: Verify signed APK excludes bundled database
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/offline/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one offline release APK; found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$apk"
          if unzip -l "$apk" | grep -E 'assets/(safe-mobile-hashdb\.bundle\.zip|hashes\.(hsb|hdb|sdb|s1b)(\.sig)?)' >/dev/null; then
            echo "SAFE STOP: APK must not embed a hash database; it syncs signed releases after install." >&2
            exit 1
          fi
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          output="SafeMobile-Antivirus-v${version_name}-code${version_code}.apk"
          cp "$apk" "$output"
          echo "apk_path=$output" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build valid harmless siren-test APK and matching local definition
        run: bash scripts/test_siren.sh

      - name: Publish installable APK to a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="safemobile-v${{ steps.verify-apk.outputs.version_name }}-code${{ steps.verify-apk.outputs.version_code }}-run${GITHUB_RUN_NUMBER}"
          cat > release-notes.txt <<EOF
          Production SafeMobile Antivirus APK.
          The signed SHA-256 database is downloaded only from this repository's GitHub Releases, verified with the embedded Ed25519 trust root before activation, and never packaged in the APK/AAB.
          The first launch queues a network-constrained WorkManager sync; scanning stays on-device.
          APK version: ${{ steps.verify-apk.outputs.version_name }} (version code ${{ steps.verify-apk.outputs.version_code }}).
          Built from commit ${GITHUB_SHA}.
          Includes scan-completion feedback, a transparent configuration score, cyan glass styling, and recursive multi-folder SAF monitoring.
          Optional harmless siren fixture: first import siren-test-definitions.json in Scan > Import definitions, then copy SafeMobile-Siren-Test.apk into a monitored folder or install it to test the post-install receiver. The test APK contains no executable code.
          Android 11+ blocks the main Download folder in SAF; select a subfolder or WhatsApp Documents. Skip remains available.
          Device test instructions: https://github.com/navyask911/VibeSync-SafeMobile-Antivirus/blob/${GITHUB_SHA}/docs/SIREN_AND_FOLDER_TESTING.md
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "SafeMobile Antivirus ${{ steps.verify-apk.outputs.version_name }} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes.txt \
            "${{ steps.verify-apk.outputs.apk_path }}" \
            "build/siren-test/SafeMobile-Siren-Test.apk" \
            "build/siren-test/siren-test-definitions.json" \
            "build/siren-test/SHA256SUMS.txt"

