name: Build and publish signed SafeMobile APK and Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - "release-apk/**"

permissions:
  contents: write

concurrency:
  group: safemobile-production-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'navyask911/VibeSync-SafeMobile-Antivirus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DB_SIGNING_PUBLIC_KEY: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'SAFE STOP: Release keystore secrets are incomplete; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          key = base64.b64decode(os.environ.get("DB_SIGNING_PUBLIC_KEY", ""), validate=True)
          if len(key) != 32:
              raise SystemExit("SAFE STOP: DB_SIGNING_PUBLIC_KEY must be a Base64 raw 32-byte Ed25519 key.")
          print("Production signing configuration and database trust root are present.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version code against tagged releases
        run: python3 scripts/check_version_code.py --release

      - name: Validate translated resources and offline font provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_locale_completeness.py
          python3 scripts/check_ja_kn_and_siren.py
          python3 scripts/check_global_threat_intelligence.py
          python3 scripts/check_proprietary_safety.py
          test "$(git hash-object app/src/main/res/font/dm_sans_regular.ttf)" = 9b1d3099a7b431b026c597c5b41be79a155adc62
          test "$(git hash-object app/src/main/res/font/dm_sans_medium.ttf)" = 39ddfe4c3612291a39c17dced309093f7241fc9c
          test "$(git hash-object app/src/main/res/font/dm_sans_bold.ttf)" = db8d71a1c74e4bfdd2c6360f55b48c4f25f626ff
          test "$(git hash-object docs/licenses/DM_SANS_OFL.txt)" = 4430b85ac62998e2edb914360f9ebdfe43f4deaa

      - name: Test bundled YARA rules before production build
        run: ./gradlew --no-daemon testOfflineDebugUnitTest

      # Gradle already stages the SHA-pinned research model into generated assets.
      # Do not also download into src/main/assets (duplicate merge entry).
      - name: Build signed offline APK and Play AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleOfflineRelease bundleOfflineRelease

      - name: Verify signed AAB and APK, model schema, YARA and no bundled malware databases
        id: verify-aab
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find app/build/outputs/bundle/offlineRelease -maxdepth 1 -type f -name '*.aab' -print)
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one signed offline AAB; found ${#aabs[@]}." >&2
            exit 1
          fi
          aab="${aabs[0]}"
          jarsigner -verify "$aab" | grep -qi 'jar verified'
          python3 - "$aab" <<'PY'
          import hashlib,json,sys,zipfile
          aab=sys.argv[1]
          with zipfile.ZipFile(aab) as z:
              names=set(z.namelist())
              manifest=z.read("base/manifest/AndroidManifest.xml")
              for required in (b"com.android.vending.BILLING", b"com.google.android.play.billingclient.version", b"8.3.0"):
                  if required not in manifest:
                      raise SystemExit("SAFE STOP: supported Google Play billing metadata absent from AAB.")
              for forbidden in (
                  b"android.permission.ACCESS_FINE_LOCATION",
                  b"android.permission.ACCESS_COARSE_LOCATION",
                  b"com.google.android.gms.permission.AD_ID",
                  b"android.permission.BIND_ACCESSIBILITY_SERVICE",
                  b"android.accessibilityservice.AccessibilityService",
              ):
                  if forbidden in manifest:
                      raise SystemExit("SAFE STOP: unexpected location/ad-ID permission or AccessibilityService declaration.")
              yara="base/assets/yara/safemobile_android_dex.yar"
              if yara not in names: raise SystemExit("SAFE STOP: reviewed YARA rules absent.")
              rules=z.read(yara).decode("utf-8")
              for required in ("rule Takopii_Overlay_Banker_DEX","rule Takopii_DCL_AntiForensics_DEX"):
                  if required not in rules: raise SystemExit("SAFE STOP: critical YARA rules absent.")
              bad=[n for n in names if n.startswith("base/assets/") and (
                  "safe-mobile-hashdb.bundle.zip" in n or
                  n.split("/")[-1].startswith(("hashes.hsb","hashes.hdb","hashes.sdb","hashes.s1b"))
              )]
              if bad: raise SystemExit("SAFE STOP: bundled MalwareBazaar database found: "+str(bad))
              schema=json.loads(z.read("base/assets/feature_schema.json"))
              if len(schema)!=215 or list(schema)!=[str(i) for i in range(215)]:
                  raise SystemExit("SAFE STOP: wrong 215-feature schema.")
              model=z.read("base/assets/malware_model.tflite")
              if len(model)!=18584 or hashlib.sha256(model).hexdigest()!=(
                  "8b66adaf01a939c26d5a756e66f53fe0d6e85e1a06ec97166579138c6ce47061"):
                  raise SystemExit("SAFE STOP: bundled model differs from pinned v1.0.1.")
              meta=json.loads(z.read("base/assets/malware_model.json"))
              if meta.get("validated") or meta.get("production_ready") or meta.get("status")!="research_candidate":
                  raise SystemExit("SAFE STOP: unvalidated research model falsely promoted.")
              print("Signed AAB contains Billing 8.3.0, pinned 18KB model, 215 schema, reviewed YARA and no hash DB.")
          PY
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          aab_output="SafeMobile-Antivirus-v${version_name}-code${version_code}.aab"
          cp "$aab" "$aab_output"
          echo "aab_path=$aab_output" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          # Verify the actual installable release APK (not a harmless siren fixture).
          mapfile -t apks < <(find app/build/outputs/apk/offline/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one signed production APK; found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" && test -x "$apksigner"
          "$apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk"
          python3 - "$apk" <<'PY'
          import hashlib,json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              files=set(z.namelist())
              for required in ("AndroidManifest.xml","assets/yara/safemobile_android_dex.yar",
                               "assets/malware_model.tflite","assets/malware_model.json"):
                  if required not in files:
                      raise SystemExit("SAFE STOP: Signed APK missing "+required)
              manifest=z.read("AndroidManifest.xml")
              for forbidden in (b"android.permission.BIND_ACCESSIBILITY_SERVICE",
                                b"android.accessibilityservice.AccessibilityService"):
                  if forbidden in manifest:
                      raise SystemExit("SAFE STOP: Signed APK declares an AccessibilityService.")
              model=z.read("assets/malware_model.tflite")
              if len(model)!=18584 or hashlib.sha256(model).hexdigest()!="8b66adaf01a939c26d5a756e66f53fe0d6e85e1a06ec97166579138c6ce47061":
                  raise SystemExit("SAFE STOP: Signed APK model failed SHA-256 pin")
              meta=json.loads(z.read("assets/malware_model.json"))
              if meta.get("validated") or meta.get("production_ready") or meta.get("status")!="research_candidate":
                  raise SystemExit("SAFE STOP: Signed APK falsely promotes research model")
              bad=[n for n in files if n.startswith("assets/") and
                   ("safe-mobile-hashdb.bundle.zip" in n or
                    n.rsplit("/",1)[-1].startswith(("hashes.hsb","hashes.hdb","hashes.sdb","hashes.s1b")))]
              if bad:
                  raise SystemExit("SAFE STOP: Hash DB bundled in APK: "+repr(bad))
          PY
          apk_output="SafeMobile-Antivirus-v${version_name}-code${version_code}.apk"
          cp "$apk" "$apk_output"
          echo "apk_path=$apk_output" >> "$GITHUB_OUTPUT"

      - name: Upload verified Play Console AAB as GitHub Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-v${{ steps.verify-aab.outputs.version_name }}-Play-AAB-${{ github.run_id }}
          path: ${{ steps.verify-aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed installable test APK as GitHub Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-v${{ steps.verify-aab.outputs.version_name }}-Signed-APK-${{ github.run_id }}
          path: ${{ steps.verify-aab.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build valid harmless siren-test APK and matching local definition
        run: bash scripts/test_siren.sh

      - name: Publish signed APK and AAB to a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="safemobile-v${{ steps.verify-aab.outputs.version_name }}-code${{ steps.verify-aab.outputs.version_code }}-run${GITHUB_RUN_NUMBER}"
          cat > release-notes.txt <<EOF
          Production SafeMobile Antivirus signed offline APK for manual testing and Android App Bundle (AAB) for Play Console.
          The signed SHA-256 database is downloaded only from this repository's GitHub Releases, verified with the embedded Ed25519 trust root before activation, and never packaged in the APK/AAB.
          The first launch queues a network-constrained WorkManager sync; scanning stays on-device.
          APK/AAB version: ${{ steps.verify-aab.outputs.version_name }} (version code ${{ steps.verify-aab.outputs.version_code }}).
          Built from commit ${GITHUB_SHA}.
          Includes pinned 18KB research v1.0.1-model and a 215-feature schema; this unvalidated candidate remains inactive as malware protection. All scanning is on-device.
          v1.0.17: optional Google Play Billing 8.3.0 consumable Pro passes with locally encrypted, device-bound expiry and actual purchased-quantity credit. Core scanning, YARA, quarantine and siren incident response stay free. No ad SDK is added.
          Pro purchase copy, quantity controls, status messages and the requested non-restorable device-bound disclaimer are translated across all 51 locale folders. Google Play purchases and optional model downloads need a connection; core protection works offline.
          Consumed Pro passes cannot be restored after uninstall, app-data clearing, reset or encryption-key loss. The local status button cannot recover consumed orders from Google Play.
          The Threat Intelligence Engine card reads a verified local stats.json cache; missing upstream statistics show the localized updating state.
          Google Play SKU safemobile_pro_1_year, its regional pricing and optional multi-quantity setting must be configured in Play Console. Verify live purchases with a license tester on the internal testing track before public rollout. This GitHub workflow does not publish to Google Play or perform a real payment.
          v1.0.13: trusted-app options menus, foreground install monitoring with silent receipt notifications, shared immediate/durable local scan processing, and Compose Canvas donut/weekly session charts.
          The reserved no-code siren fixture triggers a labeled five-second diagnostic without importing a database or recording a malware verdict. Android full-screen permission and OEM background restrictions still apply.
          Overlay remediation passes each flagged package URI; Android 11+ may still show its global overlay list.
          Includes the Phase B bundled on-device Kotlin YARA-compatible DEX scanner, adapted MIT-licensed rules, Detection Capabilities ACTIVE (LIMITED) status, and scan-rule match reporting.
          The YARA engine supports only a bounded subset of the YARA language; findings are advisory SUSPICIOUS indicators, not definitive malware verdicts.
          v1.0.12: absolute local package trust skips all scan engines and package alerts, including future updates. Untrusted packages retain automatic post-install scanning.
          Includes the battery-optimization exemption request and settings recovery for devices with restrictive background policies, including Oppo/ColorOS.
          Fix post-install scan delivery while SafeMobile runs using a runtime-registered PACKAGE_ADDED receiver; offer Android 13+ notification permission and settings recovery. Android/OEM limits still apply when the app is force-stopped.
          Improve Quarantine Vault confirmation sequencing and error handling: dismiss before asynchronous deletion, preserve Room records if file deletion fails.
          v1.0.14: localized scan verdicts, integrity warnings, permissions, accessibility labels, capability disclosures and formatted counts across all 51 supported locales. Added 84 translated string resources and 19 plural resources per locale, with locale-aware message formatting and no external translation services. The proprietary safety guard and 51-locale completeness checks must pass before release.
          Bundles pinned SIL OFL 1.1 DM Sans Regular, Medium and Bold for modern Latin typography with platform fallback for other scripts.
          Also includes scan-completion feedback, a transparent configuration score, cyan glass styling, and recursive multi-folder SAF monitoring.
          Optional harmless siren fixture: first import siren-test-definitions.json in Scan > Import definitions, then copy SafeMobile-Siren-Test.apk into a monitored folder or install it to test the post-install receiver. The test APK contains no executable code.
          Android 11+ blocks protected storage roots in SAF; select an accessible subfolder or a chat-document folder. Skip remains available.
          Device test instructions: https://github.com/navyask911/VibeSync-SafeMobile-Antivirus/blob/${GITHUB_SHA}/docs/SIREN_AND_FOLDER_TESTING.md
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "SafeMobile Antivirus ${{ steps.verify-aab.outputs.version_name }} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes.txt \
            "${{ steps.verify-aab.outputs.aab_path }}" \
            "${{ steps.verify-aab.outputs.apk_path }}" \
            "build/siren-test/SafeMobile-Siren-Test.apk" \
            "build/siren-test/siren-test-definitions.json" \
            "build/siren-test/SHA256SUMS.txt"

