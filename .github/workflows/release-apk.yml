name: Build and publish signed SafeMobile APK and Play AAB
# [release-v1.10.7] Allowlist scan-progress metadata and fail scans when result publication is lost.

on:
  workflow_dispatch:
  push:
    branches:
      - "release-apk/**"
      - "release/v1.10.8-final"
      - "main"
    paths:
      - "app/build.gradle.kts"
      - "scripts/check_admob_privacy.py"
      - "scripts/check_android_release_readiness.py"
      - "scripts/check_16kb_alignment.py"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/**"
      - "app/src/androidTest/**"
      - ".github/workflows/release-apk.yml"
    tags:
      - "v1.6.5"
      - "v1.6.6"
      - "v1.6.7"
      - "v1.7.0"
      - "v1.7.1"
      - "v1.7.2"
      - "v1.7.4"
      - "v1.7.5"
      - "v1.8.0"
      - "v1.8.1"
      - "v1.9.0"
      - "v1.9.1"
      - "v1.9.2"
      - "v1.10.0"
      - "v1.10.1"
      - "v1.10.2"
      - "v1.10.3"
      - "v1.10.4"
      - "v1.10.5"
      - "v1.10.6"
      - "v1.10.7"
      - "v1.10.8"

permissions:
  actions: read
  contents: write

concurrency:
  group: safemobile-production-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'navyask911/VibeSync-SafeMobile-Antivirus' && (github.event_name == 'workflow_dispatch' || github.ref_type != 'branch' || github.ref_name != 'main' || contains(github.event.head_commit.message, '[release-v1.10.9]'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for same-commit Android CI, locale audit and Paparazzi gates
        if: github.ref_type == 'branch' && (github.ref_name == 'release/v1.10.8-final' || (github.ref_name == 'main' && contains(github.event.head_commit.message, '[release-v1.10.9]')))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # For v1.10.9 on main, wait for all three required workflows on this exact SHA.
          # The legacy v1.10.8 branch retains its Android CI matrix gate.
          if [[ "${GITHUB_REF_NAME:-}" == "main" ]]; then
            workflows=("Android CI" "Locale Resource Audit" "Record Paparazzi UI goldens")
          else
            workflows=("Android CI")
          fi
          for attempt in $(seq 1 680); do
            all_passed=true
            for workflow_name in "${workflows[@]}"; do
              runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_name" --commit "$GITHUB_SHA" --json databaseId,status,conclusion,headSha --limit 20)"
              latest="$(jq -c --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // {}' <<< "$runs")"
              status="$(jq -r '.status // empty' <<< "$latest")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$latest")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "SAFE STOP: $workflow_name ended with conclusion '${conclusion:-unknown}' for $GITHUB_SHA." >&2
                  exit 1
                fi
                echo "$workflow_name passed for $GITHUB_SHA."
              else
                echo "$workflow_name for $GITHUB_SHA is '${status:-not yet listed}'; waiting (attempt $attempt/680; 340-minute gate)."
                all_passed=false
              fi
            done
            if [[ "$all_passed" == "true" ]]; then
              echo "All required same-commit release validation workflows passed."
              exit 0
            fi
            sleep 30
          done
          echo "SAFE STOP: Required same-commit validation did not complete successfully within the 340-minute gate." >&2
          exit 1

      - name: Require production signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DB_SIGNING_PUBLIC_KEY: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'SAFE STOP: Release keystore secrets are incomplete; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          key = base64.b64decode(os.environ.get("DB_SIGNING_PUBLIC_KEY", ""), validate=True)
          if len(key) != 32:
              raise SystemExit("SAFE STOP: DB_SIGNING_PUBLIC_KEY must be a Base64 raw 32-byte Ed25519 key.")
          print("Production signing configuration and database trust root are present.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust and cargo-ndk for YARA-X
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_DIR" ]]; then
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi
          if [[ ! -x "$SDK_ROOT/build-tools/35.0.0/zipalign" ]]; then
            "$SDKMANAGER" --install "build-tools;35.0.0"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      - name: Validate version code against tagged releases
        run: python3 scripts/check_version_code.py --release

      - name: Validate translated resources and offline font provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_locale_completeness.py
          python3 scripts/check_ja_kn_and_siren.py
          python3 scripts/check_global_threat_intelligence.py
          python3 scripts/check_admob_privacy.py
          python3 scripts/check_android_release_readiness.py
          python3 scripts/check_proprietary_safety.py
          test "$(git hash-object app/src/main/res/font/inter_variable.ttf)" = 4ab79e0102bbe0ffa1ed879b13e52ac8c6487833
          test "$(git hash-object app/src/main/assets/licenses/Inter-OFL.txt)" = 9b2ca37b3ffc77391d8b2ebef4a974ef32bf46ea

      - name: Record Paparazzi screenshots for v1.8.1 compliance UI
        run: ./gradlew --no-daemon recordPaparazziDebug

      - name: Test bundled YARA rules before production build
        run: ./gradlew --no-daemon testOfflineDebugUnitTest

      # Gradle already stages the SHA-pinned active advisory model into generated assets.
      # Do not also download into src/main/assets (duplicate merge entry).
      - name: Build signed offline APK and Play AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleOfflineRelease bundleOfflineRelease

      - name: Verify 16 KB ELF and APK alignment
        run: >-
          python3 scripts/check_16kb_alignment.py
          app/build/outputs/apk/offline/release/*.apk
          app/build/outputs/bundle/offlineRelease/*.aab

      - name: Verify signed AAB and APK, model schema, YARA and no bundled malware databases
        id: verify-aab
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find app/build/outputs/bundle/offlineRelease -maxdepth 1 -type f -name '*.aab' -print)
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one signed offline AAB; found ${#aabs[@]}." >&2
            exit 1
          fi
          aab="${aabs[0]}"
          jarsigner -verify "$aab" | grep -qi 'jar verified'
          python3 - "$aab" <<'PY'
          import gzip,hashlib,json,sys,zipfile
          from pathlib import Path
          aab=sys.argv[1]
          with zipfile.ZipFile(aab) as z:
              names=set(z.namelist())
              manifest_path="base/manifest/AndroidManifest.xml"
              if manifest_path not in names:
                  raise SystemExit("SAFE STOP: AAB base protobuf manifest is missing.")
              manifest=z.read(manifest_path)
              if not manifest:
                  raise SystemExit("SAFE STOP: AAB base protobuf manifest is empty.")
              # AAB manifests are protobuf-encoded XML; their wire bytes must not
              # be searched for UTF-8 Android manifest names or values. The paired
              # signed APK is checked below through decoded aapt XML, including
              # Play Billing, AdMob, permissions and forbidden declarations.
              yara="base/assets/yara/safemobile_android_dex.yar.dat"
              if yara not in names: raise SystemExit("SAFE STOP: compressed reviewed YARA rules absent.")
              if "base/assets/yara/safemobile_android_dex.yar" in names:
                  raise SystemExit("SAFE STOP: uncompressed YARA source is present in AAB.")
              try:
                  rules=gzip.decompress(z.read(yara)).decode("utf-8")
              except (OSError,EOFError,UnicodeDecodeError) as error:
                  raise SystemExit("SAFE STOP: bundled YARA .dat is not valid GZIP UTF-8: "+str(error))
              for required in ("rule Takopii_Overlay_Banker_DEX","rule Takopii_DCL_AntiForensics_DEX"):
                  if required not in rules: raise SystemExit("SAFE STOP: critical YARA rules absent.")
              bad=[n for n in names if n.startswith("base/assets/") and (
                  "safe-mobile-hashdb.bundle.zip" in n or
                  n.split("/")[-1].startswith(("hashes.hsb","hashes.hdb","hashes.sdb","hashes.s1b"))
              )]
              if bad: raise SystemExit("SAFE STOP: bundled MalwareBazaar database found: "+str(bad))
              schema=json.loads(z.read("base/assets/feature_schema.json"))
              if len(schema)!=215 or list(schema)!=[str(i) for i in range(215)]:
                  raise SystemExit("SAFE STOP: wrong 215-feature schema.")
              model=z.read("base/assets/model.tflite")
              if len(model)!=18584 or hashlib.sha256(model).hexdigest()!=(
                  "8b66adaf01a939c26d5a756e66f53fe0d6e85e1a06ec97166579138c6ce47061"):
                  raise SystemExit("SAFE STOP: bundled model differs from pinned v1.0.1.")
              scanner=Path("app/src/main/java/com/vibesync/antivirus/core/engine/MachineLearningScanner.kt").read_text(encoding="utf-8")
              required_gate=('MODEL_STATUS = "active"', "MODEL_TRAINED = true",
                             "MODEL_VALIDATED = true", "MODEL_PRODUCTION_READY = true",
                             "MODEL_DUMMY_UNTRAINED = false", 'MODEL_STATUS == "active"')
              if any(item not in scanner for item in required_gate):
                  raise SystemExit("SAFE STOP: active, SHA-pinned advisory TFLite model gate is missing.")
              litert_jni = [name for name in names if name.endswith("/libtensorflowlite_jni.so")]
              if not litert_jni:
                  raise SystemExit("SAFE STOP: 16 KB-compatible LiteRT JNI library is missing from the AAB.")
              print("Signed AAB verified: base protobuf manifest, LiteRT JNI, pinned model, 215 schema, reviewed YARA and no bundled hash DB; merged manifest policy is checked against its paired signed APK.")
          PY
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          aab_output="app-release.aab"
          cp "$aab" "$aab_output"
          echo "aab_path=$aab_output" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          # Verify the actual installable release APK (not a harmless siren fixture).
          mapfile -t apks < <(find app/build/outputs/apk/offline/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one signed production APK; found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" && test -x "$apksigner"
          build_tools_dir="$(dirname "$apksigner")"
          aapt="$build_tools_dir/aapt"
          test -x "$aapt"
          "$apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/safemobile-apk-manifest.xmltree"
          python3 - "$apk" "$RUNNER_TEMP/safemobile-apk-manifest.xmltree" <<'PY'
          import gzip,hashlib,json,re,sys,zipfile
          apk,tree_path=sys.argv[1:3]
          with zipfile.ZipFile(apk) as z:
              files=set(z.namelist())
              for required in ("AndroidManifest.xml","assets/yara/safemobile_android_dex.yar.dat",
                               "assets/model.tflite"):
                  if required not in files:
                      raise SystemExit("SAFE STOP: Signed APK missing "+required)
              if "assets/yara/safemobile_android_dex.yar" in files:
                  raise SystemExit("SAFE STOP: uncompressed YARA source is present in APK.")
              try:
                  rules=gzip.decompress(z.read("assets/yara/safemobile_android_dex.yar.dat")).decode("utf-8")
              except (OSError,EOFError,UnicodeDecodeError) as error:
                  raise SystemExit("SAFE STOP: signed APK YARA .dat is not valid GZIP UTF-8: "+str(error))
              for required in ("rule Takopii_Overlay_Banker_DEX","rule Takopii_DCL_AntiForensics_DEX"):
                  if required not in rules:
                      raise SystemExit("SAFE STOP: signed APK critical YARA rules absent.")

              # APK AndroidManifest.xml is compiled binary XML, not UTF-8 source.
              # Inspect the decoded aapt tree to avoid false negatives from binary
              # string-pool encoding while still checking the actual installable APK.
              lines=open(tree_path,encoding="utf-8").read().splitlines()

              def blocks(element_name):
                  found=[]
                  pattern=re.compile(r"^(\s*)E:\s+"+re.escape(element_name)+r"(?:\s|$)")
                  for index,line in enumerate(lines):
                      match=pattern.match(line)
                      if not match:
                          continue
                      indent=len(match.group(1))
                      end=len(lines)
                      for next_index in range(index+1,len(lines)):
                          nested=re.match(r"^(\s*)E:\s+",lines[next_index])
                          if nested and len(nested.group(1))<=indent:
                              end=next_index
                              break
                      found.append((index,indent,"\n".join(lines[index+1:end])))
                  return found

              applications=blocks("application")
              if not applications:
                  raise SystemExit("SAFE STOP: Signed APK application element is missing.")
              app_metadata=[]
              for app_index,app_indent,_ in applications:
                  for meta_index,meta_indent,meta_contents in blocks("meta-data"):
                      if meta_index>app_index and meta_indent>app_indent:
                          app_metadata.append(meta_contents)

              admob_meta_found=any(
                  "com.google.android.gms.ads.APPLICATION_ID" in contents and
                  "ca-app-pub-4783826505860771~3262295335" in contents
                  for contents in app_metadata
              )
              if not admob_meta_found:
                  raise SystemExit("SAFE STOP: Signed APK AdMob application metadata is missing or incorrect.")

              billing_version_found=any(
                  "com.google.android.play.billingclient.version" in contents and
                  "9.1.0" in contents
                  for contents in app_metadata
              )
              if not billing_version_found:
                  raise SystemExit("SAFE STOP: Signed APK Google Play Billing 9.1.0 metadata is missing.")

              permission_blocks=[contents for _,_,contents in blocks("uses-permission")]
              if not any("com.android.vending.BILLING" in contents for contents in permission_blocks):
                  raise SystemExit("SAFE STOP: Signed APK Google Play Billing permission is missing.")
              if not any("com.google.android.gms.permission.AD_ID" in contents for contents in permission_blocks):
                  raise SystemExit("SAFE STOP: Signed APK AD_ID permission is missing.")

              manifest_tree="\n".join(lines)
              for forbidden in (
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.BIND_ACCESSIBILITY_SERVICE",
                  "android.accessibilityservice.AccessibilityService",
              ):
                  if forbidden in manifest_tree:
                      raise SystemExit("SAFE STOP: Signed APK declares an unexpected location permission or AccessibilityService.")

              model=z.read("assets/model.tflite")
              if len(model)!=18584 or hashlib.sha256(model).hexdigest()!="8b66adaf01a939c26d5a756e66f53fe0d6e85e1a06ec97166579138c6ce47061":
                  raise SystemExit("SAFE STOP: Signed APK model failed SHA-256 pin")
              bad=[n for n in files if n.startswith("assets/") and
                   ("safe-mobile-hashdb.bundle.zip" in n or
                    n.rsplit("/",1)[-1].startswith(("hashes.hsb","hashes.hdb","hashes.sdb","hashes.s1b")))]
              if bad:
                  raise SystemExit("SAFE STOP: Hash DB bundled in APK: "+repr(bad))
          PY
          apk_output="app-release.apk"
          cp "$apk" "$apk_output"
          echo "apk_path=$apk_output" >> "$GITHUB_OUTPUT"

      - name: Upload verified Play Console AAB as GitHub Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-v${{ steps.verify-aab.outputs.version_name }}-Play-AAB-${{ github.run_id }}
          path: ${{ steps.verify-aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed installable test APK as GitHub Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-v${{ steps.verify-aab.outputs.version_name }}-Signed-APK-${{ github.run_id }}
          path: ${{ steps.verify-aab.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Package native four-tab screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -d app/src/test/snapshots
          snapshot_count="$(find app/src/test/snapshots -type f -name '*.png' | wc -l)"
          if [[ "$snapshot_count" -lt 4 ]]; then
            echo "SAFE STOP: Expected Paparazzi PNG screenshots for the four tabs; found $snapshot_count." >&2
            exit 1
          fi
          screenshots_zip="build/ui-screenshots-v${{ steps.verify-aab.outputs.version_name }}.zip"
          zip -qr "$screenshots_zip" app/src/test/snapshots
          echo "Packaged $snapshot_count Paparazzi screenshots."

      - name: Upload four-tab screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SafeMobile-v${{ steps.verify-aab.outputs.version_name }}-UI-Screenshots-${{ github.run_id }}
          path: build/ui-screenshots-v${{ steps.verify-aab.outputs.version_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build valid harmless siren-test APK and matching local definition
        run: bash scripts/test_siren.sh

      - name: Publish signed APK and AAB to a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="${{ steps.verify-aab.outputs.version_name }}"
          version_code="${{ steps.verify-aab.outputs.version_code }}"
          if [[ "${GITHUB_REF_TYPE:-}" == "branch" && "${GITHUB_REF_NAME:-}" == "main" ]]; then
            if [[ "$version_name" != "1.10.9" || "$version_code" != "20261163" ]]; then
              echo "SAFE STOP: main release trigger expected v1.10.9 / 20261163, got $version_name / $version_code." >&2
              exit 1
            fi
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.8" ]] ||
             [[ "${GITHUB_REF_TYPE:-}" == "branch" && "${GITHUB_REF_NAME:-}" == "release/v1.10.8-final" ]]; then
            if [[ "$version_name" != "1.10.8" || "$version_code" != "20261162" ]]; then
              echo "SAFE STOP: v1.10.8 release expected 1.10.8 / 20261162, got $version_name / $version_code." >&2
              exit 1
            fi
            tag="v1.10.8"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.7" ]] ||
               [[ "${GITHUB_REF_TYPE:-}" == "branch" && "${GITHUB_REF_NAME:-}" == "main" && "$version_name" == "1.10.7" && "$version_code" == "20261161" ]]; then
            tag="v1.10.7"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.6" ]]; then
            tag="v1.10.6"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.4" ]]; then
            tag="v1.10.4"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.3" ]]; then
            tag="v1.10.3"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.1" ]]; then
            tag="v1.10.1"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "v1.10.0" ]]; then
            tag="v1.10.0"
          else
            tag="safemobile-v${{ steps.verify-aab.outputs.version_name }}-code${{ steps.verify-aab.outputs.version_code }}-run${GITHUB_RUN_NUMBER}"
          fi
          cat > release-notes.txt <<EOF
          Production SafeMobile Antivirus signed offline APK for manual testing and Android App Bundle (AAB) for Play Console.
          The signed SHA-256 database is downloaded only from this repository's GitHub Releases, verified with the embedded Ed25519 trust root before activation, and never packaged in the APK/AAB.
          The first launch queues a network-constrained WorkManager sync; scanning stays on-device.
          APK/AAB version: ${{ steps.verify-aab.outputs.version_name }} (version code ${{ steps.verify-aab.outputs.version_code }}).
          Built from commit ${GITHUB_SHA}.
          v1.6.1: Added new launcher icons and splash screen. Fixed text wrapping and added back navigation. Added inline Crown subscription toggle.
          v1.6.2: Accept all file types in the scan document picker for .txt/EICAR testing; preserve the originating screen when backing out of Pro; make the paywall and shared app toolbar wrap and scroll at larger font scales.
          v1.10.8: Moves installed-app icons to bounded asynchronous IO loading with a package/version LRU cache and adds per-package scan/publish diagnostics. Includes the v1.10.6 scalar-only ViewModel, service/PendingIntent and Room boundary guards. Uses Play versionCode 20261162.
          v1.10.7: Fixes ColorOS scan publication by allowing scan-progress-path/reasons/URI and scan-resume-URI encrypted metadata purposes; counts Room publish failures and fails scans with zero persisted results or any item publication loss. Uses Play versionCode 20261161.
          v1.10.6: Collapses PackageManager results to scalar package rows before concurrent scan work; keeps OEM-private PackageInfo/ApplicationInfo confined to PackageScanner; asserts primitive-only ViewModel, service Intent/PendingIntent and Room boundaries. Uses Play versionCode 20261160.
          v1.10.5: Resets stale foreground scan sessions and tagged WorkManager scans, explicitly allows offline scan work, clears Room checkpoints before new sessions, adds worker/per-item ScanDebug logs, and revalidates persisted SAF read grants. Uses Play versionCode 20261159.
