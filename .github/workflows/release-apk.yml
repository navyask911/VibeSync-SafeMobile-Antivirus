name: Build and publish signed SafeMobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - "release-apk/**"

permissions:
  contents: write

concurrency:
  group: safemobile-production-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'navyask911/VibeSync-SafeMobile-Antivirus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production signing and database trust keys
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DB_SIGNING_PUBLIC_KEY: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'SAFE STOP: Release keystore secrets are incomplete; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          key = base64.b64decode(os.environ["DB_SIGNING_PUBLIC_KEY"], validate=True)
          if len(key) != 32:
              raise SystemExit("SAFE STOP: DB_SIGNING_PUBLIC_KEY must decode to 32 Ed25519 bytes.")
          print("Production keystore and Ed25519 trust root are configured.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download and verify latest signed database bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
          REQUIRE_DB_SIGNATURE: "true"
        run: python3 scripts/download_latest_hashdb_bundle.py

      - name: Build production offline APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAFE_MOBILE_HASHDB_ED25519_PUBLIC_KEY_B64: ${{ secrets.DB_SIGNING_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleOfflineRelease

      - name: Verify signed APK and bundled database
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/offline/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "SAFE STOP: Expected one offline release APK; found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$apk"
          unzip -l "$apk" | grep -F 'assets/safe-mobile-hashdb.bundle.zip' >/dev/null
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          output="SafeMobile-Antivirus-v${version_name}-code${version_code}.apk"
          cp "$apk" "$output"
          echo "apk_path=$output" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish installable APK to a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="safemobile-v${{ steps.verify-apk.outputs.version_name }}-code${{ steps.verify-apk.outputs.version_code }}-run${GITHUB_RUN_NUMBER}"
          cat > release-notes.txt <<EOF
          Production offline SafeMobile Antivirus APK.
          The signed MalwareBazaar SHA-256 database is bundled in the APK and verified with the embedded Ed25519 trust root on first launch.
          If the bundled database is unavailable or fails verification, the app opens with hash-database protection inactive and logs the error.
          APK version: ${{ steps.verify-apk.outputs.version_name }} (version code ${{ steps.verify-apk.outputs.version_code }}).
          Built from commit ${GITHUB_SHA}.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "SafeMobile Antivirus ${{ steps.verify-apk.outputs.version_name }} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes.txt \
            "${{ steps.verify-apk.outputs.apk_path }}"
