name: Process Android app icon and splash assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/design_assets/AppIcons.zip"
      - "app/src/main/design_assets/splash_logo.png"
      - "scripts/process_android_design_assets.py"
      - ".github/workflows/process-design-assets.yml"

permissions:
  contents: write

concurrency:
  group: android-design-assets-main
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate launcher and splash resources
        run: python scripts/process_android_design_assets.py

      - name: Validate Android resources with AAPT
        run: ./gradlew --no-daemon :app:processOfflineDebugResources

      - name: Commit generated Android resources
        shell: bash
        run: |
          set -euo pipefail
          git add -A app/src/main/res app/src/main/design_assets
          if git diff --cached --quiet; then
            echo "Generated assets are already current; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: install new launcher icons and splash screen"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
