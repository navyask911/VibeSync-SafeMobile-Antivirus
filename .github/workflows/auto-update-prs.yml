name: Auto-update PR branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo ${{ github.repository }} --state open \
            --json number --jq '.[].number' | while read pr; do
            echo "Updating PR #$pr"
            gh pr update-branch "$pr" --repo ${{ github.repository }} \
              || echo "Skipped PR #$pr (already current or conflict)"
          done
